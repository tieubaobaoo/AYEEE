<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Em Yêu Anh Không</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Be+Vietnam+Pro:wght@400;600&display=swap">
<style>
/* Một tấm thiệp hồng duy nhất ở giữa màn hình; nút "Không" chạy trốn khắp viewport */
:root {
  --bg: #fdeef2;
  --bg-2: #f9d6e0;
  --card: #fffafb;
  --ink: #4a1d2c;
  --muted: #9a5f71;
  --rose: #e0446d;
  --rose-deep: #b8274f;
  --line: #f2c4d1;
  --display: "Dancing Script", "Brush Script MT", cursive;
  --body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0;
  background: radial-gradient(120% 90% at 50% 0%, var(--bg) 0%, var(--bg-2) 100%);
  background-color: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  display: grid;
  place-items: center;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
.card {
  width: 100%;
  max-width: 380px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 24px;
  box-shadow: 0 18px 50px -20px rgba(184, 39, 79, .45);
  padding: 32px 24px 28px;
  box-sizing: border-box;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 18px;
  align-items: center;
}
.heart {
  width: 72px; height: 72px;
  animation: beat 1.2s ease-in-out infinite;
}
@keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.15); } 30% { transform: scale(1); } 45% { transform: scale(1.1); } }
h1 {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(2.4rem, 11vw, 3rem);
  line-height: 1.1;
  margin: 0;
  color: var(--rose-deep);
  text-wrap: balance;
}
.hint { margin: 0; color: var(--muted); font-size: .95rem; min-height: 1.4em; }
.actions {
  display: flex;
  gap: 14px;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  min-height: 64px;
}
button {
  font-family: var(--body);
  font-weight: 600;
  font-size: 1.05rem;
  border-radius: 999px;
  padding: 12px 28px;
  cursor: pointer;
  border: 2px solid transparent;
  touch-action: manipulation;
}
button:focus-visible { outline: 3px solid var(--rose); outline-offset: 3px; }
#yes {
  background: var(--rose);
  color: #fff;
  transition: transform .25s ease, background .2s;
  box-shadow: 0 6px 16px -6px var(--rose-deep);
}
#yes:active { background: var(--rose-deep); }
#no {
  background: var(--card);
  color: var(--rose-deep);
  border-color: var(--line);
  transition: left .28s cubic-bezier(.3,1.4,.5,1), top .28s cubic-bezier(.3,1.4,.5,1);
  z-index: 5;
}
#no.fleeing { position: fixed; margin: 0; }

.done h1 { font-size: clamp(2.6rem, 12vw, 3.4rem); }
.done p { margin: 0; color: var(--muted); font-size: 1.05rem; line-height: 1.6; }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

@media (prefers-reduced-motion: reduce) {
  .heart { animation: none; }
  #no { transition: none; }
}
</style>
</head>
<body>

<canvas id="fx"></canvas>

<main class="card" id="ask">
  <svg class="heart" viewBox="0 0 24 24" aria-hidden="true">
    <path fill="#e0446d" d="M12 21s-7.5-4.6-10-9.3C.3 8.4 2.2 4 6.3 4c2.2 0 3.6 1.2 4.4 2.4h2.6C14.1 5.2 15.5 4 17.7 4c4.1 0 6 4.4 4.3 7.7C19.5 16.4 12 21 12 21z"/>
  </svg>
  <h1>Em yêu anh không?</h1>
  <p class="hint" id="hint">Trả lời thật lòng nha 🥺</p>
  <div class="actions">
    <button id="yes" type="button">Có</button>
    <button id="no" type="button">Không</button>
  </div>
</main>

<main class="card done" id="done" hidden>
  <svg class="heart" viewBox="0 0 24 24" aria-hidden="true">
    <path fill="#e0446d" d="M12 21s-7.5-4.6-10-9.3C.3 8.4 2.2 4 6.3 4c2.2 0 3.6 1.2 4.4 2.4h2.6C14.1 5.2 15.5 4 17.7 4c4.1 0 6 4.4 4.3 7.7C19.5 16.4 12 21 12 21z"/>
  </svg>
  <h1>Anh biết mà!</h1>
  <p>Anh cũng yêu em nhiều lắm 💕</p>
</main>

<script>
(() => {
  const yes = document.getElementById('yes');
  const no = document.getElementById('no');
  const hint = document.getElementById('hint');
  const lines = [
    'Bấm nhầm rồi kìa 😝',
    'Không bắt được đâu ~',
    'Thử lại đi em 😏',
    'Nút đó hư rồi á',
    'Chọn "Có" đi mà 🥹',
    'Em chạy không thoát đâu 💘',
    'Nghĩ lại đi nè'
  ];
  let dodges = 0;
  let yesScale = 1;

  function flee(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    const vw = window.innerWidth, vh = window.innerHeight;
    const r = no.getBoundingClientRect();
    const w = r.width, h = r.height, pad = 16;
    const y = yes.getBoundingClientRect();
    let x, top, tries = 0;
    do {
      x = pad + Math.random() * Math.max(1, vw - w - pad * 2);
      top = pad + Math.random() * Math.max(1, vh - h - pad * 2);
      tries++;
      // tránh đè lên nút Có và tránh nằm ngay chỗ cũ
      var overlapYes = x < y.right + 12 && x + w > y.left - 12 && top < y.bottom + 12 && top + h > y.top - 12;
      var tooClose = Math.hypot(x - r.left, top - r.top) < 90;
    } while ((overlapYes || tooClose) && tries < 40);

    if (!no.classList.contains('fleeing')) {
      no.style.left = r.left + 'px';
      no.style.top = r.top + 'px';
      no.classList.add('fleeing');
      no.offsetWidth; // ép reflow để có hiệu ứng trượt
    }
    no.style.left = x + 'px';
    no.style.top = top + 'px';

    dodges++;
    hint.textContent = lines[(dodges - 1) % lines.length];
    if (yesScale < 1.6) { yesScale += 0.08; yes.style.transform = 'scale(' + yesScale + ')'; }
  }

  // Điện thoại: chạm vào là chạy. Máy tính: rê chuột tới là chạy.
  no.addEventListener('touchstart', flee, { passive: false });
  no.addEventListener('pointerdown', flee);
  no.addEventListener('mouseenter', flee);
  no.addEventListener('click', flee);
  no.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') flee(e); });

  window.addEventListener('resize', () => { if (no.classList.contains('fleeing')) flee(); });

  yes.addEventListener('click', () => {
    document.getElementById('ask').hidden = true;
    no.hidden = true;
    document.getElementById('done').hidden = false;
    hearts();
  });

  // Mưa tim khi bấm "Có"
  function hearts() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = document.getElementById('fx');
    const ctx = c.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    function size() { c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
    size(); addEventListener('resize', size);
    const colors = ['#e0446d', '#ff7a9a', '#b8274f', '#ffb3c6'];
    const ps = [];
    for (let i = 0; i < 90; i++) ps.push(make(true));
    function make(initial) {
      return {
        x: Math.random() * innerWidth,
        y: initial ? innerHeight / 2 + (Math.random() - .5) * 60 : -20,
        vx: (Math.random() - .5) * (initial ? 9 : 1),
        vy: initial ? -Math.random() * 11 - 3 : Math.random() * 1.5 + 1,
        s: Math.random() * 10 + 8,
        r: Math.random() * Math.PI,
        c: colors[(Math.random() * colors.length) | 0]
      };
    }
    function draw(p) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(Math.sin(p.r) * .4);
      const s = p.s / 2; ctx.fillStyle = p.c; ctx.beginPath();
      ctx.moveTo(0, s * .6);
      ctx.bezierCurveTo(-s * 1.4, -s * .4, -s * .5, -s * 1.4, 0, -s * .5);
      ctx.bezierCurveTo(s * .5, -s * 1.4, s * 1.4, -s * .4, 0, s * .6);
      ctx.fill(); ctx.restore();
    }
    let frame = 0;
    (function loop() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      if (frame % 6 === 0 && ps.length < 160) ps.push(make(false));
      for (let i = ps.length - 1; i >= 0; i--) {
        const p = ps[i];
        p.vy += 0.12; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += .05;
        if (p.vy > 2.5) p.vy = 2.5;
        draw(p);
        if (p.y > innerHeight + 30) ps[i] = make(false);
      }
      frame++;
      requestAnimationFrame(loop);
    })();
  }
})();
</script>
</body>
</html>
